services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: urlshortner
      POSTGRES_PASSWORD: urlshortner
      POSTGRES_DB: urlshortner
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  postgres_data:
